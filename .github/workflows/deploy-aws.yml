name: Infra Pipeline

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1

jobs:

  # ================================
  # JOB 1 — Build da Lambda
  # ================================
  build-lambda:
    name: Build Authentication Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Lambda
        working-directory: AuthenticationFunction
        run: mvn clean package -DskipTests

      - name: Upload Lambda Artifact
        uses: actions/upload-artifact@v4
        with:
          name: authentication-lambda-jar
          path: AuthenticationFunction/target/AuthenticationFunction-1.0-SNAPSHOT.jar


  # ================================
  # JOB 2 — Terraform (Infra)
  # ================================
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-lambda   # depende do build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda Artifact
        uses: actions/download-artifact@v4
        with:
          name: authentication-lambda-jar
          path: AuthenticationFunction/target

      - name: Verify Artifact
        run: ls -lh AuthenticationFunction/target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve